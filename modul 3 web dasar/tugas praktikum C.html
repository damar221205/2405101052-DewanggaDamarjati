<!DOCTYPE html>
<html>
<head>
    <title>Formulir Perpustakaan Madiun</title>
</head>
<body>

<h2>FORMULIR PENDAFTARAN PERPUSTAKAAN MADIUN</h2>

<form action="#" method="get">

    <label>Nama Lengkap:</label>
    <input type="text" name="nama" />
    <br /><br />

    <label>NIM:</label>
    <input type="text" name="nim" />
    <br /><br />

    <label>Jenis Kelamin:</label>
    <input type="radio" name="jenis_kelamin" value="Laki-laki" />
    Laki-laki
    <input type="radio" name="jenis_kelamin" value="Perempuan" />
    Perempuan
    <br /><br />

    <label>Email:</label>
    <input type="text" name="email" />
    <br /><br />

    <label>Nomor Telepon:</label>
    <input type="text" name="telepon" />
    <br /><br />

    <label>Program Studi:</label>
    <select name="program_studi">
        <option value="Teknik Informatika">Teknik Informatika</option>
        <option value="Sistem Informasi">Sistem Informasi</option>
        <option value="Manajemen">Manajemen</option>
        <option value="Akuntansi">Akuntansi</option>
        <option value="Lainnya">Lainnya</option>
    </select>
    <br /><br />

    <label>Jenis Buku yang Disukai:</label>
    <br />
    <input type="checkbox" name="buku" value="Novel" /> Novel
    <br />
    <input type="checkbox" name="buku" value="Buku Ilmiah" /> Buku Ilmiah
    <br />
    <input type="checkbox" name="buku" value="Teknologi" /> Teknologi
    <br />
    <input type="checkbox" name="buku" value="Sejarah" /> Sejarah
    <br /><br />

    <label>Alamat:</label>
    <br />
    <textarea name="alamat" rows="4" cols="30"></textarea>
    <br /><br />

    <label>Alasan Bergabung:</label>
    <br />
    <textarea name="alasan" rows="4" cols="30"></textarea>
    <br /><br />

    <input type="submit" value="Daftar" />
    <input type="reset" value="Reset" />

</form>

</body>
</html>
```
