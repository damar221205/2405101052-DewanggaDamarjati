<!DOCTYPE html>
<html >
<head>
    <title>Belajar Membuat Form</title>
    <link rel="stylesheet" href="LatihanM3.CSS">
</head>
<body>
        <h1>Login</h1>
    <form action="formulir.html" method="get">
        Nama: <input type="text" name="Nama" value="Nama Kamu" />
    <br/>
        Password: <input type="password" name="password" />
    <br/>
    Jenis Kelamin:
    <input type="radio" name="jenis_kelamin" value="laki-laki" checked />
    laki-laki
    <br/>
    <input type="radio" name="jenis_kelamin" value="perempuan" checked />
    perempuan
    <br/>
    Hobi: 
        <input type="checkbox" name="hobi_baca" checked /> Membaca Buku
        <input type="checkbox" name="hobi_nulis" checked /> Menulis
        <input type="checkbox" name="hobi_mancing" checked /> Memancing
    <br/>
    Asal Kota:
    <select name="asal_kota" >
        <option value="Kota_Jakarta" > Jakarta</option>
        <option>Bandung</option>
        <option value="Kota_Semarang" selected>Semarang</option>
    </select>
    <br/>
    Komentar Anda:
    <textarea name="Komentar" rows="5" cols="20">
        Silahkan katakan isi hati anda
    </textarea>
    <p></p>
    <input type="submit" value="Mulai Proses!"/>
    </form>
</body>
</html>
