```html
<!DOCTYPE html>
<html>
<head>
    <title>Formulir Klinik Sehat</title>
</head>
<body>

<h2>FORMULIR PENDAFTARAN PASIEN KLINIK SEHAT</h2>

<form action="#" method="get">

    <label>Nama Lengkap:</label>
    <input type="text" name="nama" />
    <br /><br />

    <label>NIK:</label>
    <input type="text" name="nik" />
    <br /><br />

    <label>Tanggal Lahir:</label>
    <input type="date" name="tanggal_lahir" />
    <br /><br />

    <label>Jenis Kelamin:</label>
    <input type="radio" name="jenis_kelamin" value="Laki-laki" />
    Laki-laki
    <input type="radio" name="jenis_kelamin" value="Perempuan" />
    Perempuan
    <br /><br />

    <label>Nomor Telepon:</label>
    <input type="text" name="telepon" />
    <br /><br />

    <label>Email:</label>
    <input type="text" name="email" />
    <br /><br />

    <label>Alamat:</label>
    <br />
    <textarea name="alamat" rows="4" cols="30"></textarea>
    <br /><br />

    <label>Keluhan Utama:</label>
    <br />
    <textarea name="keluhan" rows="4" cols="30"></textarea>
    <br /><br />

    <label>Poli Tujuan:</label>
    <select name="poli">
        <option value="Poli Umum">Poli Umum</option>
        <option value="Poli Gigi">Poli Gigi</option>
        <option value="Poli Anak">Poli Anak</option>
        <option value="Poli Kesehatan Ibu">Poli Kesehatan Ibu</option>
    </select>
    <br /><br />

    <label>Gejala yang Dirasakan:</label>
    <br />
    <input type="checkbox" name="gejala" value="Demam" /> Demam
    <br />
    <input type="checkbox" name="gejala" value="Batuk" /> Batuk
    <br />
    <input type="checkbox" name="gejala" value="Pusing" /> Pusing
    <br />
    <input type="checkbox" name="gejala" value="Mual" /> Mual
    <br />
    <input type="checkbox" name="gejala" value="Lainnya" /> Lainnya
    <br /><br />

    <label>Catatan Tambahan:</label>
    <br />
    <textarea name="catatan" rows="4" cols="30"></textarea>
    <br /><br />

    <input type="submit" value="Kirim Formulir" />
    <input type="reset" value="Reset" />

</form>

</body>
</html>
```
